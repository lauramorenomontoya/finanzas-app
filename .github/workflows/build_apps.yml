name: Compilar Aplicaciones (Mac y Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Compilar para macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyarmor

      - name: Ofuscar código fuente con PyArmor
        run: |
          pyarmor gen -O build/obf -r main.py controllers core database services ui

      - name: Compilar con PyInstaller
        run: |
          pyinstaller montu.spec --noconfirm --clean

      - name: Crear instalador DMG
        run: |
          hdiutil create -volname "Montu" -srcfolder "dist/Montu.app" -ov -format UDZO "dist/Montu_macOS.dmg"

      - name: Subir instalador de Mac
        uses: actions/upload-artifact@v4
        with:
          name: Montu_macOS
          path: dist/Montu_macOS.dmg

  build-windows:
    name: Compilar para Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyarmor

      - name: Ofuscar código fuente con PyArmor
        run: |
          pyarmor gen -O build/obf -r main.py controllers core database services ui

      - name: Compilar con PyInstaller
        run: |
          pyinstaller montu.spec --noconfirm --clean

      - name: Comprimir paquete de Windows
        run: |
          powershell -Command "Compress-Archive -Path 'dist/montu' -DestinationPath 'dist/Montu_Windows.zip' -Force"

      - name: Subir paquete de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Montu_Windows
          path: dist/Montu_Windows.zip

  release:
    name: Publicar Release en GitHub
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artefacto macOS
        uses: actions/download-artifact@v4
        with:
          name: Montu_macOS
          path: ./release_assets

      - name: Descargar artefacto Windows
        uses: actions/download-artifact@v4
        with:
          name: Montu_Windows
          path: ./release_assets

      - name: Crear GitHub Release en finanzas-app
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          echo "Archivos descargados para el release:"
          ls -la ./release_assets
          # Limpiar release anterior o borrador si existiera
          gh release delete "${{ github.ref_name }}" --repo lauramorenomontoya/finanzas-app --yes || true
          # Crear el nuevo release oficial con los instaladores
          gh release create "${{ github.ref_name }}" \
            --repo lauramorenomontoya/finanzas-app \
            --target main \
            --title "Montu ${{ github.ref_name }}" \
            --notes "Instaladores oficiales de Montu ${{ github.ref_name }}." \
            ./release_assets/Montu_macOS.dmg \
            ./release_assets/Montu_Windows.zip
