name: Compilar Aplicaciones (Mac y Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Compilar para macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyarmor

      - name: Ofuscar código fuente con PyArmor
        run: |
          pyarmor gen -O build/obf -r main.py controllers core database services ui

      - name: Compilar con PyInstaller
        run: |
          pyinstaller ControlFinanciero.spec --noconfirm --clean

      - name: Crear instalador DMG
        run: |
          hdiutil create -volname "Control Financiero" -srcfolder "dist/ControlFinanciero.app" -ov -format UDZO "dist/ControlFinanciero_macOS.dmg"

      - name: Subir instalador de Mac
        uses: actions/upload-artifact@v4
        with:
          name: ControlFinanciero_macOS
          path: dist/ControlFinanciero_macOS.dmg

  build-windows:
    name: Compilar para Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyarmor

      - name: Ofuscar código fuente con PyArmor
        run: |
          pyarmor gen -O build/obf -r main.py controllers core database services ui

      - name: Compilar con PyInstaller
        run: |
          pyinstaller ControlFinanciero.spec --noconfirm --clean

      - name: Comprimir paquete de Windows
        run: |
          powershell -Command "Compress-Archive -Path 'dist/ControlFinanciero' -DestinationPath 'dist/ControlFinanciero_Windows.zip' -Force"

      - name: Subir paquete de Windows
        uses: actions/upload-artifact@v4
        with:
          name: ControlFinanciero_Windows
          path: dist/ControlFinanciero_Windows.zip

  release:
    name: Publicar Release en GitHub
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artefacto macOS
        uses: actions/download-artifact@v4
        with:
          name: ControlFinanciero_macOS
          path: ./release_assets

      - name: Descargar artefacto Windows
        uses: actions/download-artifact@v4
        with:
          name: ControlFinanciero_Windows
          path: ./release_assets

      - name: Crear GitHub Release en finanzas-app
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          repository: lauramorenomontoya/finanzas-app
          files: |
            ./release_assets/ControlFinanciero_macOS.dmg
            ./release_assets/ControlFinanciero_Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
